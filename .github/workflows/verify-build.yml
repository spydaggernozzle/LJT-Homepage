name: Verify page structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify single publications page
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          test ! -e _site/publications/synlogic/index.html
          test ! -e _site/publications/c-eval/index.html
          if find _site/publications -mindepth 2 -name index.html | grep -q .; then
            echo "Unexpected publication detail page" >&2
            exit 1
          fi
          if grep -E 'href="[^"]*/publications/(synlogic|c-eval|2025|2024|2023)' _site/publications/index.html; then
            echo "Publication index links to a disabled detail page" >&2
            exit 1
          fi
          for text in "Junteng Liu" "Personal Details" "Education" "Research Experience" "Skills" "Contact Information" "SynLogic" "C-Eval"; do
            grep -Fq "$text" _site/index.html
            grep -Fq "$text" _site/publications/index.html || [ "$text" != "SynLogic" ] && [ "$text" != "C-Eval" ] || false
          done
