name: Verify page structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          test ! -e _site/publications/synlogic/index.html
          test ! -e _site/publications/c-eval/index.html
          if find _site/publications -mindepth 2 -name index.html | grep -q .; then
            echo "Unexpected publication detail page" >&2
            exit 1
          fi
          if grep -E 'href="[^"]*/publications/(synlogic|c-eval|2025|2024|2023)' _site/publications/index.html; then
            echo "Publication index links to a disabled detail page" >&2
            exit 1
          fi
          for text in \
            "Junteng Liu" "Personal Details" "Education" "Research Experience" \
            "Skills" "Contact Information" "SynLogic" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" "C-Eval" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          do
            grep -Fq "$text" _site/index.html
          done
          for text in \
            "SynLogic" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" "C-Eval" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          do
            grep -Fq "$text" _site/publications/index.html
          done
